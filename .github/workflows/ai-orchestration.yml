name: AI Orchestration

on:
  issues:
    types: [opened, labeled, reopened]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: "pump | plan | review | status | requeue"
        type: choice
        options: [pump, plan, review, status, requeue]
        default: pump
      target:
        description: "Issue or PR number (plan/review)"
        required: false
        default: ""
      limit:
        description: "Max worker tasks to claim"
        type: number
        default: 2
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ secrets.AI_BRIDGE_PAT || secrets.GITHUB_TOKEN }}
  TARGET_REPO: ${{ vars.TARGET_REPO }}
  AI_BRIDGE_APP_DIR: app-workspace
  AI_BRIDGE_PERSIST: "1"
  AI_BRIDGE_QUEUE_REF: ${{ github.ref_name }}
  AI_ECONOMY_API_KEY: ${{ secrets.AI_ECONOMY_API_KEY }}
  AI_ECONOMY_BASE_URL: ${{ vars.AI_ECONOMY_BASE_URL }}
  PM_MODEL: ${{ vars.PM_MODEL }}
  WORKER_MODEL: ${{ vars.WORKER_MODEL }}
  REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}

jobs:
  pm-plan:
    name: PM plan master spec
    runs-on: ubuntu-latest
    concurrency:
      group: ai-queue-${{ github.repository }}
      cancel-in-progress: false
    if: |
      (github.event_name == 'issues'
        && contains(github.event.issue.labels.*.name, 'type:master-spec')
        && (github.event.action != 'labeled' || github.event.label.name == 'type:master-spec')
        && github.actor != 'github-actions[bot]'
        && !startsWith(github.actor, 'dependabot'))
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'plan')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AI_BRIDGE_PAT || secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore usage cache
        uses: actions/cache@v4
        with:
          path: .ai-bridge
          key: ai-bridge-usage-${{ github.run_id }}
          restore-keys: |
            ai-bridge-usage-
      - name: Decompose master spec into queue
        env:
          TARGET_ISSUE: ${{ github.event.issue.number || inputs.target }}
        run: |
          set -euo pipefail
          test -n "$TARGET_ISSUE"
          python scripts/ai_bridge.py plan --issue "$TARGET_ISSUE"

  ci:
    name: Deterministic CI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run stack checks
        run: |
          set -euo pipefail
          ran=0
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
            npm run lint --if-present
            npm test --if-present
            ran=1
          fi
          if [ -f requirements.txt ]; then
            python -m pip install -q -r requirements.txt
            ran=1
          fi
          if [ -f pyproject.toml ]; then
            python -m pip install -q -e . || true
            ran=1
          fi
          if [ "$ran" -eq 1 ] && { [ -d tests ] || [ -f pytest.ini ] || grep -q "pytest" pyproject.toml 2>/dev/null; }; then
            python -m pip install -q pytest
            python -m pytest -q
          fi
          if [ -f go.mod ]; then
            go vet ./...
            go test ./...
            ran=1
          fi
          if [ -f Cargo.toml ]; then
            cargo clippy -- -D warnings
            cargo test
            ran=1
          fi
          python -m py_compile scripts/ai_bridge.py
          if [ "$ran" -eq 0 ]; then
            echo "::notice::No application stack detected; bridge syntax check passed."
          fi

  review:
    name: Agent code review
    needs: ci
    if: |
      always() && !cancelled()
      && (
        github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.mode == 'review')
        || (github.event_name == 'pull_request'
          && vars.TARGET_REPO == ''
          && needs.ci.result == 'success'
          && contains(github.event.pull_request.labels.*.name, 'agent:auto')
          && !contains(github.event.pull_request.labels.*.name, 'escalation'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AI_BRIDGE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore usage cache
        uses: actions/cache@v4
        with:
          path: .ai-bridge
          key: ai-bridge-usage-${{ github.run_id }}
          restore-keys: |
            ai-bridge-usage-
      - name: Review PR(s) after deterministic CI
        env:
          TARGET_PR: ${{ github.event.pull_request.number || inputs.target }}
        run: |
          set -uo pipefail
          if [ -n "${TARGET_PR:-}" ]; then
            python scripts/ai_bridge.py review --pr "$TARGET_PR"
          else
            python scripts/ai_bridge.py sweep --limit 2
          fi
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Circuit breaker tripped::3 strikes reached; PR closed and escalation issue opened."
            exit 0
          fi
          exit "$code"
      - name: Pump queue after review
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AI_BRIDGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ai-orchestration.yml \
            --ref "${{ github.event.repository.default_branch || 'main' }}" \
            -f mode=pump

  claim:
    name: Claim queue tasks
    needs: [pm-plan]
    concurrency:
      group: ai-queue-${{ github.repository }}
      cancel-in-progress: false
    if: |
      always() && !cancelled()
      && github.event_name != 'pull_request'
      && (
        needs.pm-plan.result == 'success'
        || github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.mode == 'pump')
      )
    outputs:
      matrix: ${{ steps.claim.outputs.matrix }}
      count: ${{ steps.claim.outputs.count }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AI_BRIDGE_PAT || secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Claim up to concurrency cap
        id: claim
        env:
          CLAIM_LIMIT: ${{ github.event.inputs.limit || '2' }}
        run: |
          set -euo pipefail
          python scripts/ai_bridge.py claim --limit "$CLAIM_LIMIT" --github-output "$GITHUB_OUTPUT"

  workers:
    name: Worker ${{ matrix.task_id }}
    needs: claim
    if: needs.claim.outputs.count != '0' && needs.claim.outputs.count != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.claim.outputs.matrix || '{"include":[]}') }}
    concurrency:
      group: ai-worker-${{ matrix.task_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout factory repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AI_BRIDGE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Checkout target application repo
        if: vars.TARGET_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TARGET_REPO }}
          path: app-workspace
          token: ${{ secrets.AI_BRIDGE_PAT }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore usage cache
        uses: actions/cache@v4
        with:
          path: .ai-bridge
          key: ai-bridge-usage-${{ github.run_id }}
          restore-keys: |
            ai-bridge-usage-
      - name: Configure agent identity
        run: |
          git config user.name "AI Worker"
          git config user.email "ai-worker@users.noreply.github.com"
          if [ -d "${AI_BRIDGE_APP_DIR}/.git" ]; then
            git -C "$AI_BRIDGE_APP_DIR" config user.name "AI Worker"
            git -C "$AI_BRIDGE_APP_DIR" config user.email "ai-worker@users.noreply.github.com"
          fi
      - name: Execute isolated task
        run: |
          python scripts/ai_bridge.py run --task-id "${{ matrix.task_id }}"

  maintenance:
    name: Queue maintenance
    concurrency:
      group: ai-queue-${{ github.repository }}
      cancel-in-progress: false
    if: |
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
        && (inputs.mode == 'status' || inputs.mode == 'requeue'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AI_BRIDGE_PAT || secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recover stale leases
        run: python scripts/ai_bridge.py requeue-stale
      - name: Queue status
        run: python scripts/ai_bridge.py status
