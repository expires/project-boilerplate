[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-board"
version = "0.1.0"
description = "Local filesystem multi-agent board: Claude architect + DeepSeek PM/worker/reviewer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
agents = "agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agents = ["py.typed"]
